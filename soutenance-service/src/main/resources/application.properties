spring.application.name=soutenance-service
server.port=8084

spring.config.import=optional:configserver:http://localhost:8888

spring.graphql.graphiql.enabled=true
spring.graphql.websocket.path=/graphql

# Configuration du televersement de fichiers (alignée avec inscription-service)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# Repertoire racine pour le stockage des documents de soutenance
storage.base-path=C:/PRJ/Doctoral-project/doctoral-uploads
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.notifications.topic=inscription-events

# Seuils de prérequis pour la soutenance (configurables via Spring Cloud Config)
soutenance.prereq.min-publications=2
soutenance.prereq.min-communications=2
soutenance.prereq.min-heures-formation=200
soutenance.prereq.max-duree-annees=6
