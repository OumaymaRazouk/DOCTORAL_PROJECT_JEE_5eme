spring.application.name=gateway-service
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Discovery Locator pour routes automatiques
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route explicite vers inscription-service
spring.cloud.gateway.routes[0].id=inscription
spring.cloud.gateway.routes[0].uri=lb://inscription-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/inscription/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# CORS global
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
