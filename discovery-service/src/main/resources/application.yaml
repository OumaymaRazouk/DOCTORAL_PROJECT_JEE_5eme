server:
  port: 8761

spring:
  application:
    name: discovery-service
  cloud:
    service-registry:
      auto-registration:
        enabled: false

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false


management:
  endpoints:
    web:
      exposure:
        include: "*"
