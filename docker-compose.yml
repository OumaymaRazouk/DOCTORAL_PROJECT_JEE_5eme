version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-doctorat
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: doctorat
      MYSQL_USER: doctorat
      MYSQL_PASSWORD: doctorat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3-debian-12-r22
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnamilegacy/kafka:3.3.2-debian-11-r11
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

  config-server:
    image: doctorat/config-server:latest
    container_name: config-server
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8888:8888"

  discovery-service:
    image: doctorat/discovery-service:latest
    container_name: discovery-service
    depends_on:
      - config-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8761:8761"

  gateway-service:
    image: doctorat/gateway-service:latest
    container_name: gateway-service
    depends_on:
      - discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    ports:
      - "8080:8080"

  utilisateurs-service:
    image: doctorat/utilisateurs-service:latest
    container_name: utilisateurs-service
    depends_on:
      - discovery-service
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctorat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: doctorat
      SPRING_DATASOURCE_PASSWORD: doctorat

  inscription-service:
    image: doctorat/inscription-service:latest
    container_name: inscription-service
    depends_on:
      - discovery-service
      - mysql
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctorat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: doctorat
      SPRING_DATASOURCE_PASSWORD: doctorat
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  soutenance-service:
    image: doctorat/soutenance-service:latest
    container_name: soutenance-service
    depends_on:
      - discovery-service
      - mysql
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctorat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: doctorat
      SPRING_DATASOURCE_PASSWORD: doctorat
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  notification-service:
    image: doctorat/notification-service:latest
    container_name: notification-service
    depends_on:
      - discovery-service
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 465
      MAIL_USERNAME: chtiouimariam745@gmail.com
      MAIL_PASSWORD: liexbwevulmspxmy

  inscription-stat-soap-service:
    image: doctorat/inscription-stat-soap-service:latest
    container_name: inscription-stat-soap-service
    depends_on:
      - discovery-service
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctorat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: doctorat
      SPRING_DATASOURCE_PASSWORD: doctorat

  soutenance-stat-grpc-service:
    image: doctorat/soutenance-stat-grpc-service:latest
    container_name: soutenance-stat-grpc-service
    depends_on:
      - discovery-service
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctorat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: doctorat
      SPRING_DATASOURCE_PASSWORD: doctorat

  portail-doctorat-frontend:
    image: doctorat/portail-doctorat-frontend:latest
    container_name: portail-doctorat-frontend
    depends_on:
      - gateway-service
    environment:
      # Adapter l'URL de l'API si nécessaire
      API_BASE_URL: http://gateway-service:8080
    ports:
      - "4200:80"

volumes:
  mysql_data:
